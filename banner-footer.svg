<svg width="100%" height="120" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer animé - nuages cloud sur fond sombre" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg-footer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132036" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <g id="cloud-shape-f">
      <path d="M0,26
               a13,13 0 0 1 13,-13
               a18,18 0 0 1 35,-4
               a14,14 0 0 1 20,13
               a12,12 0 0 1 -1,24
               h-65
               a13,13 0 0 1 -2,-20 z"/>
    </g>
  </defs>

  <rect width="1200" height="120" fill="url(#bg-footer)" />

  <!-- back layer -->
  <g fill="#14b8a6" opacity="0.14">
    <g transform="translate(0,0)">
      <use href="#cloud-shape-f" transform="translate(60,15) scale(1.2)" />
      <use href="#cloud-shape-f" transform="translate(360,40) scale(0.9)" />
    </g>
    <g transform="translate(600,0)">
      <use href="#cloud-shape-f" transform="translate(60,15) scale(1.2)" />
      <use href="#cloud-shape-f" transform="translate(360,40) scale(0.9)" />
    </g>
    <g transform="translate(1200,0)">
      <use href="#cloud-shape-f" transform="translate(60,15) scale(1.2)" />
      <use href="#cloud-shape-f" transform="translate(360,40) scale(0.9)" />
    </g>
    <animateTransform attributeName="transform" type="translate"
                       from="0 0" to="-600 0" dur="40s" repeatCount="indefinite" />
  </g>

  <!-- front layer -->
  <g fill="#14b8a6" opacity="0.28" stroke="#0d9488" stroke-width="0.4">
    <g transform="translate(0,0)">
      <use href="#cloud-shape-f" transform="translate(50,70) scale(0.6)" />
    </g>
    <g transform="translate(350,0)">
      <use href="#cloud-shape-f" transform="translate(50,80) scale(0.45)" />
    </g>
    <g transform="translate(700,0)">
      <use href="#cloud-shape-f" transform="translate(50,70) scale(0.6)" />
    </g>
    <g transform="translate(1050,0)">
      <use href="#cloud-shape-f" transform="translate(50,80) scale(0.45)" />
    </g>
    <animateTransform attributeName="transform" type="translate"
                       from="0 0" to="-350 0" dur="18s" repeatCount="indefinite" />
  </g>

  <line x1="0" y1="119" x2="1200" y2="119" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        fill="#94a3b8" font-size="12" font-family="Fira Code, Consolas, monospace" letter-spacing="1.5">
    © KENMOE KEMGANG Marc Bertrand · Built with Java &amp; Spring Boot
  </text>
</svg>
