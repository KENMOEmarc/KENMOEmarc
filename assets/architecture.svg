<svg width="100%" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend architecture diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#14b8a6"/>
    </marker>
  </defs>
  <rect width="1000" height="620" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <text x="500" y="45" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#94a3b8" letter-spacing="2">CLIENTS</text>
  <line x1="500" y1="55" x2="500" y2="90" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- REST API box -->
  <rect x="380" y="95" width="240" height="60" rx="8" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#f8fafc">REST API</text>
  <text x="500" y="140" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#94a3b8">Spring Web / Controllers</text>

  <!-- branch lines to 3 boxes -->
  <line x1="500" y1="155" x2="500" y2="180" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="180" x2="820" y2="180" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="180" x2="180" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="180" x2="500" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="180" x2="820" y2="205" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Business Logic -->
  <rect x="70" y="210" width="220" height="70" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="240" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">Business Logic</text>
  <text x="180" y="260" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#94a3b8">Services / Validation</text>

  <!-- Security -->
  <rect x="390" y="210" width="220" height="70" rx="8" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="500" y="240" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">Security</text>
  <text x="500" y="260" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#94a3b8">JWT / OAuth2</text>

  <!-- Events -->
  <rect x="710" y="210" width="220" height="70" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
  <text x="820" y="240" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">Events</text>
  <text x="820" y="260" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#94a3b8">Async / Notifications</text>

  <!-- converge down to Persistence -->
  <line x1="180" y1="280" x2="180" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="820" y1="280" x2="820" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="180" y1="330" x2="820" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="330" x2="500" y2="355" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Persistence -->
  <rect x="330" y="360" width="340" height="90" rx="8" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="500" y="388" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">Persistence</text>
  <line x1="360" y1="400" x2="640" y2="400" stroke="#334155" stroke-width="1"/>
  <text x="500" y="422" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94a3b8">MySQL / PostgreSQL</text>
  <text x="500" y="440" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94a3b8">JPA / Hibernate</text>

  <line x1="500" y1="450" x2="500" y2="480" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Infrastructure -->
  <rect x="280" y="485" width="440" height="95" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="513" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13.5" font-weight="700" fill="#f8fafc">Infrastructure</text>
  <line x1="310" y1="525" x2="690" y2="525" stroke="#334155" stroke-width="1"/>
  <text x="500" y="548" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94a3b8">Docker · Linux · AWS</text>
  <text x="500" y="566" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94a3b8">CI/CD</text>
</svg>
