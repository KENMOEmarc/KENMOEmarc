<svg width="100%" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering principles diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Hub -->
  <rect x="360" y="30" width="180" height="50" rx="25" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="450" y="61" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#14b8a6" letter-spacing="1">ENGINEERING</text>

  <!-- 3 spokes -->
  <line x1="450" y1="80" x2="450" y2="105" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="105" x2="740" y2="105" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="105" x2="160" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="450" y1="105" x2="450" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="740" y1="105" x2="740" y2="128" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <g font-family="Fira Code, Consolas, monospace">
    <rect x="70" y="132" width="180" height="56" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="165" text-anchor="middle" font-size="13.5" fill="#f8fafc">Simplicity</text>

    <rect x="360" y="132" width="180" height="56" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="165" text-anchor="middle" font-size="13.5" fill="#f8fafc">Security</text>

    <rect x="650" y="132" width="180" height="56" rx="8" fill="#132036" stroke="#334155" stroke-width="1.5"/>
    <text x="740" y="165" text-anchor="middle" font-size="13.5" fill="#f8fafc">Testability</text>
  </g>

  <!-- converge to Maintainability -->
  <line x1="160" y1="188" x2="160" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="450" y1="188" x2="450" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="740" y1="188" x2="740" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="160" y1="230" x2="740" y2="230" stroke="#334155" stroke-width="1.5"/>
  <line x1="450" y1="230" x2="450" y2="255" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="330" y="260" width="240" height="56" rx="8" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="450" y="293" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#f8fafc">Maintainability</text>

  <line x1="450" y1="316" x2="450" y2="341" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="330" y="346" width="240" height="56" rx="8" fill="#132036" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="450" y="379" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#14b8a6">Scalability</text>
</svg>
