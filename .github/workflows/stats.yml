name: Generate GitHub stats

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: anuraghazra/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=KENMOEmarc&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0f172a&title_color=14b8a6&icon_color=14b8a6&text_color=f8fafc'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: anuraghazra/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=KENMOEmarc&layout=compact&theme=tokyonight&hide_border=true&bg_color=0f172a&title_color=14b8a6&text_color=f8fafc'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub stats" || echo "No changes"
          git push
