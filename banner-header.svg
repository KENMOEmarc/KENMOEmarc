<svg width="100%" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bannière animée - nuages cloud sur fond sombre" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#132036" />
    </linearGradient>

    <!-- nuage "tech" : forme géométrique arrondie typique des icônes cloud computing -->
    <g id="cloud-shape">
      <path d="M0,40
               a20,20 0 0 1 20,-20
               a28,28 0 0 1 54,-6
               a22,22 0 0 1 30,20
               a18,18 0 0 1 -2,36
               h-100
               a20,20 0 0 1 -2,-30 z"/>
    </g>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)" />

  <!-- grille de points discrète -->
  <g fill="#334155" opacity="0.35">
    <circle cx="40" cy="30" r="1.6"/><circle cx="70" cy="30" r="1.6"/><circle cx="100" cy="30" r="1.6"/>
    <circle cx="1100" cy="170" r="1.6"/><circle cx="1130" cy="170" r="1.6"/><circle cx="1160" cy="170" r="1.6"/>
  </g>

  <!-- BACK layer: nuages plus grands, plus doux, plus lents -->
  <g fill="#14b8a6" opacity="0.16">
    <g transform="translate(0,0)">
      <use href="#cloud-shape" transform="translate(40,25) scale(1.3)" />
      <use href="#cloud-shape" transform="translate(340,60) scale(1.0)" />
    </g>
    <g transform="translate(600,0)">
      <use href="#cloud-shape" transform="translate(40,25) scale(1.3)" />
      <use href="#cloud-shape" transform="translate(340,60) scale(1.0)" />
    </g>
    <g transform="translate(1200,0)">
      <use href="#cloud-shape" transform="translate(40,25) scale(1.3)" />
      <use href="#cloud-shape" transform="translate(340,60) scale(1.0)" />
    </g>
    <animateTransform attributeName="transform" type="translate"
                       from="0 0" to="-600 0" dur="45s" repeatCount="indefinite" />
  </g>

  <!-- FRONT layer: nuages plus petits, plus nets, plus rapides -->
  <g fill="#14b8a6" opacity="0.3" stroke="#0d9488" stroke-width="0.5">
    <g transform="translate(0,0)">
      <use href="#cloud-shape" transform="translate(80,125) scale(0.7)" />
    </g>
    <g transform="translate(400,0)">
      <use href="#cloud-shape" transform="translate(80,140) scale(0.55)" />
    </g>
    <g transform="translate(800,0)">
      <use href="#cloud-shape" transform="translate(80,125) scale(0.7)" />
    </g>
    <g transform="translate(1200,0)">
      <use href="#cloud-shape" transform="translate(80,140) scale(0.55)" />
    </g>
    <animateTransform attributeName="transform" type="translate"
                       from="0 0" to="-400 0" dur="20s" repeatCount="indefinite" />
  </g>

  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle"
        fill="#f8fafc" font-size="34" font-family="Fira Code, Consolas, monospace" font-weight="700"
        letter-spacing="0.5">
    KENMOE — Backend Software Engineer
  </text>
  <text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle"
        fill="#14b8a6" font-size="14" font-family="Fira Code, Consolas, monospace" letter-spacing="2">
    JAVA 17 • SPRING BOOT • CLOUD
  </text>
</svg>
