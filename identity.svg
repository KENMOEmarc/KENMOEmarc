<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend Software Engineer identity card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#132036"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- subtle grid dots -->
  <g fill="#334155" opacity="0.35">
    <circle cx="60" cy="40" r="1.6"/><circle cx="90" cy="40" r="1.6"/><circle cx="120" cy="40" r="1.6"/>
    <circle cx="60" cy="70" r="1.6"/><circle cx="90" cy="70" r="1.6"/><circle cx="120" cy="70" r="1.6"/>
    <circle cx="1080" cy="190" r="1.6"/><circle cx="1110" cy="190" r="1.6"/><circle cx="1140" cy="190" r="1.6"/>
    <circle cx="1080" cy="220" r="1.6"/><circle cx="1110" cy="220" r="1.6"/><circle cx="1140" cy="220" r="1.6"/>
  </g>

  <text x="60" y="88" font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700" fill="#f8fafc">
    KENMOE KEMGANG Marc Bertrand
  </text>

  <text x="60" y="122" font-family="Fira Code, Consolas, monospace" font-size="19" font-weight="600" fill="#14b8a6" letter-spacing="1.5">
    BACKEND SOFTWARE ENGINEER
  </text>

  <text x="60" y="150" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#94a3b8" letter-spacing="0.5">
    JAVA 17  •  SPRING BOOT  •  REST APIs  •  CLOUD
  </text>

  <line x1="60" y1="168" x2="360" y2="168" stroke="url(#teal)" stroke-width="2"/>

  <!-- flow: API -> SECURITY -> DATA -> CLOUD -->
  <g font-family="Fira Code, Consolas, monospace" font-size="12.5" fill="#f8fafc">
    <g transform="translate(60,205)">
      <circle cx="0" cy="0" r="4" fill="#14b8a6">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="4">API</text>
    </g>
    <line x1="105" y1="205" x2="215" y2="205" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(225,205)">
      <circle cx="0" cy="0" r="4" fill="#14b8a6">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="4">SECURITY</text>
    </g>
    <line x1="330" y1="205" x2="440" y2="205" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(450,205)">
      <circle cx="0" cy="0" r="4" fill="#14b8a6">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="4">DATA</text>
    </g>
    <line x1="500" y1="205" x2="610" y2="205" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(620,205)">
      <circle cx="0" cy="0" r="4" fill="#14b8a6">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="14" y="4">CLOUD</text>
    </g>
  </g>

  <!-- right-side minimal mark -->
  <g transform="translate(1020,55)" opacity="0.9">
    <rect x="0" y="0" width="120" height="150" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="35" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#94a3b8">stack</text>
    <text x="60" y="62" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#f8fafc">Java 17</text>
    <text x="60" y="84" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#14b8a6">Spring Boot</text>
    <text x="60" y="106" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#f8fafc">MySQL</text>
    <text x="60" y="128" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#94a3b8">Docker</text>
  </g>
</svg>
