<svg width="100%" height="360" viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learning roadmap timeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="360" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <line x1="80" y1="120" x2="1020" y2="120" stroke="#334155" stroke-width="2"/>

  <!-- nodes: acquired -->
  <g font-family="Fira Code, Consolas, monospace">
    <g transform="translate(120,120)">
      <circle r="9" fill="#14b8a6"/>
      <text y="-24" text-anchor="middle" font-size="13" fill="#f8fafc">Java 17</text>
      <text y="34" text-anchor="middle" font-size="10.5" fill="#94a3b8">acquired</text>
    </g>
    <g transform="translate(320,120)">
      <circle r="9" fill="#14b8a6"/>
      <text y="-24" text-anchor="middle" font-size="13" fill="#f8fafc">Spring Boot</text>
      <text y="34" text-anchor="middle" font-size="10.5" fill="#94a3b8">acquired</text>
    </g>
    <g transform="translate(520,120)">
      <circle r="9" fill="#14b8a6"/>
      <text y="-24" text-anchor="middle" font-size="13" fill="#f8fafc">REST APIs</text>
      <text y="34" text-anchor="middle" font-size="10.5" fill="#94a3b8">acquired</text>
    </g>

    <!-- current: pulsing -->
    <g transform="translate(720,120)">
      <circle r="12" fill="none" stroke="#14b8a6" stroke-width="2">
        <animate attributeName="r" values="10;16;10" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="9" fill="#f8fafc"/>
      <text y="-24" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">Spring Cloud</text>
      <text y="34" text-anchor="middle" font-size="10.5" fill="#14b8a6">exploring now</text>
    </g>

    <!-- upcoming -->
    <g transform="translate(920,120)">
      <circle r="9" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text y="-24" text-anchor="middle" font-size="13" fill="#94a3b8">Kubernetes</text>
      <text y="34" text-anchor="middle" font-size="10.5" fill="#94a3b8">next</text>
    </g>
  </g>

  <!-- bottom summary arrow -->
  <text x="550" y="230" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#94a3b8">
    Backend Engineering  →  Distributed Systems  →  Cloud Native
  </text>
  <line x1="200" y1="250" x2="900" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="550" y="280" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#334155">
    roadmap direction
  </text>
</svg>
